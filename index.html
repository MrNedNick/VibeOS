<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/VibeOS/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0f0f5" media="(prefers-color-scheme: light)" />
    <title>VibeOS — Log one thing. Everything updates.</title>
    <meta name="description" content="A simpler Notion for your life — habits, tasks, goals, learning in one place. Check off a habit and your goal moves on its own. No setup, local-first, free." />
    <meta property="og:title" content="VibeOS — Log one thing. Everything updates." />
    <meta property="og:description" content="A simpler Notion for your life — habits, tasks, goals, learning in one place. Check off a habit and your goal moves on its own." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <!-- SPA routing fix for GitHub Pages: decode path encoded by 404.html -->
    <script>
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        var search = location.search;
        if (search) {
          var p = new URLSearchParams(search).get('p');
          if (p != null) {
            var q = new URLSearchParams(search).get('q');
            history.replaceState(null, null,
              location.pathname.split('/').slice(0, -1).join('/') + '/' + p +
              (q ? '?' + q.replace(/~and~/g, '&') : '') + location.hash
            );
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
